name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  smoke-test:
    # End-to-end check of what exists so far: the small dataset lands
    # correctly and the container stack configuration is valid.
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Land the small Contoso sample
        run: uv run python -m ingestion.land_source contoso_10k
      - name: Landing is idempotent (second run must skip)
        run: uv run python -m ingestion.land_source contoso_10k | tee out.txt && grep -q "already landed" out.txt
      - name: Validate docker compose configuration
        run: cp .env.example .env && docker compose config --quiet
