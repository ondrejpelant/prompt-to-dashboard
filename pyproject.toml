[project]
name = "prompt-to-dashboard"
version = "0.1.0"
description = "Layered data warehouse with governed metadata and an LLM agent that builds BI dashboards from natural-language prompts."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "dbt-core>=1.10,<2",
    "dbt-postgres>=1.9,<2",
    "google-genai>=3.3.0",
    "psycopg[binary]>=3.3.9",
    "py7zr>=0.22",
    "pyyaml>=6.0",
    "streamlit>=1.67.0",
]

[dependency-groups]
dev = [
    "poethepoet>=0.48.0",
    "pre-commit>=4.0",
    "ruff>=0.17",
]

[tool.uv]
# Not a distributable package: modules are run from the repo root (python -m ...).
package = false

# ---------------------------------------------------------------------------
# Developer tasks - the same commands on Windows, macOS, Linux and in CI.
# Run from the repo root:  uv run poe <task>      (uv run poe  lists them all)
# ---------------------------------------------------------------------------
[tool.poe.tasks.env]
help = "Create .env from .env.example if it does not exist yet"
script = "tools.devtasks:ensure_env"

[tool.poe.tasks.setup]
help = "First-time setup: create .env and install the git pre-commit hooks"
sequence = ["env", { cmd = "pre-commit install" }]

[tool.poe.tasks.up]
help = "Start Postgres and Metabase (Metabase on http://localhost:3000)"
sequence = ["env", { cmd = "docker compose up -d" }]

[tool.poe.tasks.down]
help = "Stop the containers (data is kept)"
cmd = "docker compose down"

[tool.poe.tasks.reset]
help = "Stop the containers and DELETE the Postgres volume with all its data"
cmd = "docker compose down -v"

[tool.poe.tasks.logs]
help = "Follow container logs"
cmd = "docker compose logs -f"

[tool.poe.tasks.land]
help = "Download a source into the landing zone (default contoso_100k; e.g. poe land contoso_10k --force)"
cmd = "python -m ingestion.land_source"

[tool.poe.tasks.raw]
help = "Load the newest landed load into raw (default contoso_100k; e.g. poe raw contoso_10k)"
cmd = "python -m ingestion.load_raw"
envfile = ".env"

[tool.poe.tasks.dbt]
help = "Run any dbt command in the dbt project (e.g. poe dbt run --select stg_store)"
cmd = "dbt"
cwd = "dbt"
envfile = ".env"

[tool.poe.tasks.build]
help = "Build and test all dbt models (staging, later core and marts)"
cmd = "dbt build"
cwd = "dbt"
envfile = ".env"

[tool.poe.tasks.metabase]
help = "Connect Metabase to the warehouse and check that it sees all descriptions"
cmd = "python -m bi.sync_metabase"
envfile = ".env"

[tool.poe.tasks.ask]
help = "Answer a question with a Metabase dashboard (e.g. poe ask \"net revenue by year\")"
cmd = "python -m agent.ask"
envfile = ".env"
# Keeps accented characters readable when the output is piped on Windows
env = { PYTHONUTF8 = "1" }

[tool.poe.tasks.chat]
help = "Talk to the agent: answers in words plus one dashboard that follow-ups refine"
cmd = "python -m agent.chat"
envfile = ".env"
env = { PYTHONUTF8 = "1" }

[tool.poe.tasks.app]
help = "Open the chat UI in the browser: answers plus the dashboard side by side"
cmd = "streamlit run agent/app.py"
envfile = ".env"
# PYTHONPATH: "streamlit run" does not add the repo root to sys.path the way
# "python -m" does, so the agent/bi packages would not be importable without it.
env = { PYTHONUTF8 = "1", PYTHONPATH = "." }

[tool.poe.tasks.eval]
help = "Measure the agent on the evaluation questions (add --no-metadata for the baseline)"
cmd = "python -m eval.run_eval"
envfile = ".env"
env = { PYTHONUTF8 = "1" }

[tool.poe.tasks.lint]
help = "Check code style"
sequence = [{ cmd = "ruff check ." }, { cmd = "ruff format --check ." }]

[tool.poe.tasks.format]
help = "Auto-fix code style"
sequence = [{ cmd = "ruff check --fix ." }, { cmd = "ruff format ." }]

[tool.poe.tasks.check]
help = "Run all pre-commit checks on every file"
cmd = "pre-commit run --all-files"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PTH"]
