name: prompt_to_dashboard
version: "0.1.0"
profile: prompt_to_dashboard

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

models:
  prompt_to_dashboard:
    # Write model and column descriptions into Postgres as comments, so that
    # Metabase and any SQL client see the same documentation as dbt.
    +persist_docs:
      relation: true
      columns: true
    staging:
      +schema: staging
      +materialized: view
    core:
      +schema: core
      +materialized: table
      # The BI tool and the agent read the core schema through a read-only role.
      # Tables are recreated on every build, so the grant is applied every time.
      +grants:
        select: ["{{ env_var('BI_DB_USER') }}"]

on-run-end:
  - "grant usage on schema core to {{ env_var('BI_DB_USER') }}"
